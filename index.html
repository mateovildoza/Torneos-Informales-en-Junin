<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mateo Vildoza - Tenis de Mesa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- SDK de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // REEMPLAZÁ ESTO CON TUS DATOS DE FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "tu-proyecto.firebaseapp.com",
            projectId: "tu-proyecto",
            storageBucket: "tu-proyecto.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // CLAVE PARA BORRAR RESEÑAS (Cambiá esto por la clave que quieras)
        const CLAVE_ADMIN = "1234"; 

        const contenedor = document.getElementById('contenedorResenas');
        const form = document.getElementById('formResena');

        // Función para cargar reseñas
        async function cargarResenas() {
            contenedor.innerHTML = "<p style='color: #666;'>Cargando opiniones...</p>";
            try {
                const q = query(collection(db, "resenas"), orderBy("fecha", "desc"));
                const querySnapshot = await getDocs(q);
                
                contenedor.innerHTML = "";
                
                if(querySnapshot.empty) {
                    contenedor.innerHTML = "<p style='color: #666;'>Todavía no hay reseñas. ¡Sé el primero en dejar una!</p>";
                    return;
                }

                querySnapshot.forEach((documento) => {
                    const r = documento.data();
                    const docId = documento.id;

                    const tarjeta = document.createElement('div');
                    tarjeta.classList.add('tarjeta-resena');
                    tarjeta.innerHTML = `
                        <div class="tarjeta-header">
                            <div>
                                <div class="estrellas">★★★★★</div>
                                <span class="autor">${escapeHTML(r.nombre)} ${escapeHTML(r.apellido)}</span>
                                <span class="categoria">Usuario: @${escapeHTML(r.usuario)}</span>
                            </div>
                            <button class="btn-eliminar" data-id="${docId}" title="Eliminar reseña (solo admin)">🗑️</button>
                        </div>
                        <p class="comentario">${escapeHTML(r.comentario)}</p>
                    `;
                    contenedor.appendChild(tarjeta);
                });

                // Asignar eventos a los botones de eliminar
                document.querySelectorAll('.btn-eliminar').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        const id = this.getAttribute('data-id');
                        const passwordIngresada = prompt("Ingresá tu clave de administrador para eliminar esta reseña:");
                        
                        if (passwordIngresada === CLAVE_ADMIN) {
                            try {
                                await deleteDoc(doc(db, "resenas", id));
                                alert("Reseña eliminada correctamente.");
                                cargarResenas();
                            } catch (error) {
                                console.error("Error al eliminar:", error);
                                alert("Hubo un error al eliminar la reseña.");
                            }
                        } else if (passwordIngresada !== null) {
                            alert("Clave incorrecta. No tenés permiso para eliminar.");
                        }
                    });
                });

            } catch (e) {
                console.error("Error cargando reseñas: ", e);
                contenedor.innerHTML = "<p style='color: #d9534f;'>Configurá tus credenciales de Firebase en el código para ver y guardar reseñas.</p>";
            }
        }

        // Función para agregar reseña
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn = document.getElementById('btnEnviar');
            btn.textContent = "Enviando...";
            btn.disabled = true;

            const nombre = document.getElementById('nombre').value.trim();
            const apellido = document.getElementById('apellido').value.trim();
            const usuario = document.getElementById('usuario').value.trim();
            const comentario = document.getElementById('comentario').value.trim();

            try {
                await addDoc(collection(db, "resenas"), {
                    nombre: nombre,
                    apellido: apellido,
                    usuario: usuario,
                    comentario: comentario,
                    fecha: serverTimestamp()
                });

                form.reset();
                alert('¡Reseña publicada con éxito!');
                cargarResenas();
            } catch (e) {
                console.error("Error al guardar: ", e);
                alert('Hubo un error al publicar. Asegurate de haber configurado bien las credenciales de Firebase.');
            } finally {
                // Esto asegura que el botón SIEMPRE vuelva a la normalidad aunque falle
                btn.textContent = "Publicar Reseña";
                btn.disabled = false;
            }
        });

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        window.addEventListener('DOMContentLoaded', cargarResenas);
    </script>
